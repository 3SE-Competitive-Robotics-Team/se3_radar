# NanoSDR 板子分工（第一阶段：两发两收）
# 每块板需在固件 U 盘的 config.txt 里改成不同子网，主机侧网卡地址同子网 .10
# 已确认的板在 uri 后注明序列号；其余 IP 仍是占位值，按实际改。每块板的 zmq / ctrl 端口必须互不相同。
# 2026-10-20 实测：三块板固件逐字节相同（v0.39-dirty，04-11 为 CLG400 编译），固件本身没问题。
# 序列号 03d76352…（IP 192.168.3.2）射频芯片不响应，收发都不行，待售后，不要分配。
# 启动：python3 scripts/run_board.py <板名>

boards:
  tx_info:
    uri: ip:192.168.2.1
    role: tx
    wave: info
    zmq: tcp://127.0.0.1:53201
    ctrl: 53211
    attenuation: 70      # 发射衰减 dB，实验室近距离从大衰减开始
  tx_jam:
    uri: ip:192.168.3.1    # 序列号 03d7604a…：发射正常，接收校准失败（硬件），只能当发射板
    role: tx
    wave: jam
    zmq: tcp://127.0.0.1:53202
    ctrl: 53212
    attenuation: 70
    key: null            # 固定密钥；null 为随机
  rx_info:
    uri: ip:192.168.4.2    # 序列号 03df62b3…：收发正常（2026-10-20 实测读到采样）
    role: rx
    wave: info
    zmq: tcp://127.0.0.1:53301
    ctrl: 53311
    offset: 0            # 板子频偏校准值 Hz，AFC 从这里开始
    gain_mode: slow_attack
  rx_jam:
    uri: ip:192.168.5.1
    role: rx
    wave: jam
    zmq: tcp://127.0.0.1:53302
    ctrl: 53312
    offset: 0
    gain_mode: slow_attack

# 手动选择（第一阶段不接裁判系统）
team: red          # 发射源所在基座 / 接收雷达所属阵营
jam_level: 1       # 1~3
