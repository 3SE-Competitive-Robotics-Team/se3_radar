name: pytest

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同一个 PR 推了新提交时取消还在排队 / 运行的旧 CI；main 上每次合并都完整跑，不取消
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # 3.10：比赛机 Ubuntu 22.04；3.12：开发用 WSL Ubuntu 24.04
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e .[dev]
      # TCR 赛场实录 IQ：唯一独立于我们自己发射端的参照
      - uses: actions/cache@v4
        with:
          path: data/tcr
          key: tcr-iq-a78bf35d
      - run: bash scripts/fetch_tcr_samples.sh
      - run: python -m pytest -v

  # 系统 apt 装 GNU Radio，用系统 Python 跑全部测试（含 tests/test_gnuradio.py 的真实流图）
  gnuradio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            gnuradio python3-zmq python3-yaml python3-numpy python3-pytest
      - uses: actions/cache@v4
        with:
          path: data/tcr
          key: tcr-iq-a78bf35d
      - run: bash scripts/fetch_tcr_samples.sh
      - name: pytest（流图测试不允许被跳过）
        run: |
          python3 -c "from gnuradio import gr, iio, zeromq; print('GNU Radio', gr.version())"
          PYTHONPATH=$PWD python3 -m pytest -v -rs tests/ | tee pytest.log
          ! grep -E "SKIPPED.*test_gnuradio" pytest.log
