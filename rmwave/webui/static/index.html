<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>信息波调试台</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --line: #dfe2e7; --text: #1d2229; --muted: #6a7380;
  --ok: #1f9d55; --warn: #c27c0e; --bad: #d1352b; --idle: #8b95a1; --accent: #2563eb;
  --plot-bg: #0f1419; --plot-grid: #26303b; --plot-text: #9aa7b4; --trace: #4fd1c5; --hold: #f6ad55;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --panel: #161b22; --line: #2a313b; --text: #e6e9ee; --muted: #8b95a1;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --idle: #6e7681; --accent: #58a6ff;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --panel: #161b22; --line: #2a313b; --text: #e6e9ee; --muted: #8b95a1;
  --ok: #3fb950; --warn: #d29922; --bad: #f85149; --idle: #6e7681; --accent: #58a6ff;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px;
  border: 1px solid var(--line); font-size: 12px; color: var(--muted); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.spacer { flex: 1; }
button.theme { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px;
  padding: 2px 8px; cursor: pointer; font: inherit; font-size: 12px; }
main { padding: 16px; max-width: 1500px; margin: 0 auto; display: grid; gap: 16px; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.card, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.card { padding: 12px 14px; }
.card h2, .panel h2 { margin: 0; font-size: 15px; font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sub { color: var(--muted); font-size: 12px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin-top: 8px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.panel { padding: 12px 14px; display: grid; gap: 12px; }
.panel-grid { display: grid; gap: 12px; grid-template-columns: minmax(0, 2.2fr) minmax(280px, 1fr); }
@media (max-width: 900px) { .panel-grid { grid-template-columns: 1fr; } }
.plot { position: relative; }
canvas { width: 100%; display: block; border-radius: 6px; background: var(--plot-bg); }
.readout { position: absolute; right: 8px; top: 6px; font: 12px ui-monospace, Consolas, monospace;
  color: var(--plot-text); pointer-events: none; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.nowrap { white-space: nowrap; }
.msg { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); word-break: break-all; }
.key { font: 600 15px ui-monospace, Consolas, monospace; color: var(--accent); }
.bad-text { color: var(--bad); } .ok-text { color: var(--ok); } .warn-text { color: var(--warn); }
.empty { color: var(--muted); padding: 8px 0; }
details > summary { cursor: pointer; color: var(--muted); font-size: 12px; }
.section-title { font-size: 12px; color: var(--muted); margin: 0 0 4px; font-weight: 500; }
</style>
</head>
<body>
<header>
  <h1>信息波调试台</h1>
  <span class="chip" id="conn"><span class="dot"></span>连接中…</span>
  <span class="chip" id="cfg">—</span>
  <span class="spacer"></span>
  <span class="chip" id="clock">—</span>
  <button class="theme" id="theme" title="切换亮/暗">主题</button>
</header>
<main>
  <section class="cards" id="cards"></section>
  <section id="rx-panels" style="display:grid; gap:16px"></section>
</main>
<script>
"use strict";
const FS = 1e6, N = 1024, DB_MIN = -130, DB_MAX = 0, WF_ROWS = 160;
let state = null;
const panels = {};          // name -> {spec, wf, hold, ...}

// ---------- 主题 ----------
(() => {
  const btn = document.getElementById("theme");
  let t = null;
  try { t = localStorage.getItem("theme"); } catch (e) {}
  if (t) document.documentElement.dataset.theme = t;
  btn.onclick = () => {
    const cur = document.documentElement.dataset.theme ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch (e) {}
  };
})();

// ---------- 小工具 ----------
const $ = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v; else if (k === "html") el.innerHTML = v; else el.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) el.append(k);
  return el;
};
const fmt = (v, d = 1) => (v == null || Number.isNaN(v)) ? "—" : Number(v).toFixed(d);
const mhz = hz => hz == null ? "—" : (hz / 1e6).toFixed(2) + " MHz";
const khz = hz => hz == null ? "—" : (hz >= 0 ? "+" : "") + (hz / 1e3).toFixed(1) + " kHz";
const age = s => s == null ? "—" : s < 1 ? "刚刚" : s < 60 ? s.toFixed(0) + " 秒前" : (s / 60).toFixed(0) + " 分钟前";
const badge = (cls, text) => $("span", {class: "chip"}, $("span", {class: "dot " + cls}), text);
const waveName = w => !w ? "—" : (w.team === "red" ? "红方" : "蓝方") + (w.level === 0 ? "信息波" : `干扰波 L${w.level}`);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
function msgText(m) {
  if (m == null) return "（未知命令或长度不符）";
  return Object.entries(m).map(([k, v]) => `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`).join(" ");
}

// ---------- 板子卡片 ----------
function boardBadges(b) {
  const out = [];
  out.push(b.reachable == null ? badge("", "板子 未探测") : b.reachable ? badge("ok", "板子 在线") : badge("bad", "板子 离线"));
  out.push(b.running ? badge("ok", "进程 运行中") : badge(b.status_age == null ? "" : "warn",
    b.status_age == null ? "进程 未启动" : "进程 已停止"));
  return out;
}
function card(b) {
  const s = b.status || {}, w = s.wave, r = b.rates || {}, wc = b.window_counts || {};
  const kv = [];
  const row = (k, v) => kv.push($("dt", {}, k), $("dd", {html: v}));
  row("地址", esc(b.uri || "—"));
  row("频点", w ? mhz(w.center_hz) : "—");
  if (b.role === "tx") {
    row("已发包", s.sent_packets ?? "—");
    row("发包速率", r.packets == null ? "—" : fmt(r.packets, 1) + " 包/秒");
    row("发射衰减", s.attenuation_db == null ? "—" : fmt(s.attenuation_db, 0) + " dB");
    if (s.key) row("密钥", `<span class="key">${esc(s.key)}</span>`);
  } else {
    const afc = s.afc || {};
    row("空口包", (r.packets == null ? "—" : fmt(r.packets, 1)) + " 包/秒");
    row("裁判帧", (r.frames == null ? "—" : fmt(r.frames, 1)) + " 帧/秒");
    row("AFC", s.afc ? `<span class="${afc.locked ? "ok-text" : "warn-text"}">${afc.locked ? "锁定" : "搜索"}</span> ${khz(afc.offset_hz)}` : "—");
    const c16 = wc.crc16_fail, c8 = wc.crc8_fail;
    row(`CRC 失败（${b.window}s）`, (c8 == null && c16 == null) ? "—" :
      `<span class="${(c8 || c16) ? "bad-text" : ""}">CRC8 ${c8 ?? "—"} · CRC16 ${c16 ?? "—"}</span>`);
    if (s.keys && s.keys.length) row("密钥", s.keys.map(k => `<span class="key">${esc(k)}</span>`).join(" "));
  }
  return $("article", {class: "card"},
    $("h2", {}, b.name, $("span", {class: "sub"}, (b.role === "tx" ? "发射 · " : "接收 · ") + (w ? waveName(w) : (b.wave_cfg === "info" ? "信息波" : "干扰波")))),
    $("div", {class: "badges"}, ...boardBadges(b)),
    $("dl", {class: "kv"}, ...kv));
}

// ---------- 接收板面板 ----------
function ensurePanel(name) {
  if (panels[name]) return panels[name];
  const spec = $("canvas", {height: 220}), wf = $("canvas", {height: WF_ROWS});
  const readout = $("div", {class: "readout"});
  const title = $("h2", {}, name);
  const diag = $("div"), cmds = $("div"), recent = $("div");
  const el = $("section", {class: "panel"},
    title,
    $("div", {class: "panel-grid"},
      $("div", {style: "display:grid; gap:8px"},
        $("div", {class: "plot"}, spec, readout),
        wf,
        $("div", {class: "sub", id: `legend-${name}`})),
      $("div", {style: "display:grid; gap:12px; align-content:start"},
        $("div", {}, $("p", {class: "section-title"}, "解析诊断"), diag),
        $("div", {}, $("p", {class: "section-title"}, "各命令最近到达"), cmds))),
    $("details", {open: ""}, $("summary", {}, "最近帧"), recent));
  document.getElementById("rx-panels").append(el);
  const p = {name, el, title, spec, wf, readout, diag, cmds, recent, db: null, hold: null, board: null, hoverX: null};
  spec.addEventListener("mousemove", e => { const r = spec.getBoundingClientRect(); p.hoverX = (e.clientX - r.left) / r.width; drawSpectrum(p); });
  spec.addEventListener("mouseleave", () => { p.hoverX = null; p.readout.textContent = ""; drawSpectrum(p); });
  panels[name] = p;
  return p;
}

function fitCanvas(c) {
  const dpr = window.devicePixelRatio || 1, w = Math.round(c.clientWidth * dpr), h = Math.round(c.clientHeight * dpr);
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; return true; }
  return false;
}
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function drawSpectrum(p) {
  const c = p.spec; fitCanvas(c);
  const g = c.getContext("2d"), W = c.width, H = c.height, dpr = window.devicePixelRatio || 1;
  g.fillStyle = css("--plot-bg"); g.fillRect(0, 0, W, H);
  const x = f => (f + FS / 2) / FS * W, y = d => (DB_MAX - d) / (DB_MAX - DB_MIN) * H;
  // 网格
  g.strokeStyle = css("--plot-grid"); g.lineWidth = 1; g.fillStyle = css("--plot-text"); g.font = `${11 * dpr}px ui-monospace, monospace`;
  for (let d = DB_MIN; d <= DB_MAX; d += 20) { g.beginPath(); g.moveTo(0, y(d)); g.lineTo(W, y(d)); g.stroke(); g.fillText(`${d}`, 4 * dpr, y(d) - 3 * dpr); }
  for (let f = -500e3; f <= 500e3; f += 100e3) { g.beginPath(); g.moveTo(x(f), 0); g.lineTo(x(f), H); g.stroke(); }
  const b = p.board, s = b && b.status || {}, w = s.wave;
  // 各波的位置（先画本板的波；其他标签与已画的重叠就不画）
  const isOwn = m => w && m.level === w.level && m.team === w.team;
  const drawn = [];
  for (const m of ((b && b.markers) || []).slice().sort((a, c) => isOwn(c) - isOwn(a))) {
    const own = isOwn(m);
    g.fillStyle = own ? "rgba(79,209,197,0.16)" : (m.team === "red" ? "rgba(248,81,73,0.10)" : "rgba(88,166,255,0.10)");
    g.fillRect(x(m.offset_hz - m.bandwidth_hz / 2), 0, x(m.offset_hz + m.bandwidth_hz / 2) - x(m.offset_hz - m.bandwidth_hz / 2), H);
    g.fillStyle = own ? "#4fd1c5" : css("--plot-text");
    const lw = g.measureText(m.label).width;
    const lx = Math.max(32 * dpr, Math.min(W - lw - 4 * dpr, x(m.offset_hz - m.bandwidth_hz / 2) + 3 * dpr));
    if (!drawn.some(([a, c]) => lx < c + 6 * dpr && lx + lw > a - 6 * dpr)) { g.fillText(m.label, lx, H - 6 * dpr); drawn.push([lx, lx + lw]); }
  }
  // AFC 当前偏移
  if (s.afc) {
    g.strokeStyle = s.afc.locked ? "#3fb950" : "#d29922"; g.setLineDash([4 * dpr, 4 * dpr]);
    g.beginPath(); g.moveTo(x(s.afc.offset_hz), 0); g.lineTo(x(s.afc.offset_hz), H); g.stroke(); g.setLineDash([]);
  }
  const trace = (arr, color, width) => {
    g.strokeStyle = color; g.lineWidth = width * dpr; g.beginPath();
    for (let i = 0; i < arr.length; i++) { const px = (i + 0.5) / arr.length * W, py = y(Math.max(DB_MIN, Math.min(DB_MAX, arr[i]))); i ? g.lineTo(px, py) : g.moveTo(px, py); }
    g.stroke();
  };
  if (p.hold) trace(p.hold, css("--hold"), 1);
  if (p.db) trace(p.db, css("--trace"), 1.2);
  if (!p.db) { g.fillStyle = css("--plot-text"); g.font = `${13 * dpr}px system-ui, sans-serif`; g.fillText("还没有频谱数据（接收板进程未运行？）", 12 * dpr, 24 * dpr); }
  // 鼠标读数
  if (p.hoverX != null && p.db) {
    const i = Math.max(0, Math.min(N - 1, Math.floor(p.hoverX * N))), f = (i + 0.5) / N * FS - FS / 2;
    g.strokeStyle = "rgba(255,255,255,0.35)"; g.beginPath(); g.moveTo(p.hoverX * W, 0); g.lineTo(p.hoverX * W, H); g.stroke();
    const abs = w ? ((w.center_hz + f) / 1e6).toFixed(4) + " MHz" : "";
    p.readout.textContent = `${khz(f)}  ${abs}  ${p.db[i].toFixed(1)} dBFS`;
  }
}

function colormap(t) {   // 0..1 → 深蓝-青-黄-白
  t = Math.max(0, Math.min(1, t));
  const stops = [[0, [8, 12, 30]], [0.35, [20, 70, 140]], [0.6, [40, 180, 170]], [0.85, [240, 210, 80]], [1, [255, 255, 240]]];
  for (let k = 1; k < stops.length; k++) if (t <= stops[k][0]) {
    const [t0, c0] = stops[k - 1], [t1, c1] = stops[k], u = (t - t0) / (t1 - t0);
    return c0.map((v, j) => Math.round(v + (c1[j] - v) * u));
  }
  return stops[stops.length - 1][1];
}
function pushWaterfall(p, db) {
  const c = p.wf, resized = fitCanvas(c), g = c.getContext("2d"), W = c.width, H = c.height;
  if (resized) { g.fillStyle = css("--plot-bg"); g.fillRect(0, 0, W, H); }
  const rowH = Math.max(1, Math.round(H / WF_ROWS));
  g.drawImage(c, 0, 0, W, H - rowH, 0, rowH, W, H - rowH);
  const img = g.createImageData(W, 1);
  for (let px = 0; px < W; px++) {
    const i = Math.min(N - 1, Math.floor(px / W * N)), [r, gg, bb] = colormap((db[i] - (-110)) / 100);
    img.data.set([r, gg, bb, 255], px * 4);
  }
  for (let k = 0; k < rowH; k++) g.putImageData(img, 0, k);
}

function onSpectrum(msg) {
  const p = panels[msg.board]; if (!p) return;
  p.db = msg.db;
  if (!p.hold) p.hold = msg.db.slice();
  else for (let i = 0; i < N; i++) p.hold[i] = Math.max(msg.db[i], p.hold[i] - 0.15);
  drawSpectrum(p); pushWaterfall(p, msg.db);
}

function renderPanel(b) {
  const p = ensurePanel(b.name); p.board = b;
  const s = b.status || {}, w = s.wave, d = s.demod || {}, re = s.reassembler || {}, wc = b.window_counts || {};
  p.title.replaceChildren(b.name, $("span", {class: "sub"}, w ? `${waveName(w)} · ${mhz(w.center_hz)} · 带宽 ${(w.bandwidth_hz / 1e3).toFixed(0)} kHz` : "等待状态…"), ...boardBadges(b));
  document.getElementById(`legend-${b.name}`).textContent =
    `横轴：中心频点 ±500 kHz；青色线为实时频谱，橙色为峰值保持；虚线为 AFC 当前偏移（绿=锁定，黄=搜索）；色块为红蓝双方各波的位置。频谱 ${age(b.spectrum_age)}`;
  const diagRows = [
    ["接入码候选", d.candidates, wc.candidates], ["空口包（通过）", d.packets, wc.packets],
    ["接入码误码过多", d.rejected_ac, wc.rejected_ac], ["包头不符", d.rejected_header, wc.rejected_header],
    ["极性反转", d.inverted, null], ["裁判帧", re.frames, wc.frames],
    ["CRC8 失败", re.crc8_fail, wc.crc8_fail], ["CRC16 失败", re.crc16_fail, wc.crc16_fail],
    ["跳过字节（含帧间 0x00 填充）", re.dropped_bytes, wc.dropped_bytes],
  ];
  p.diag.replaceChildren($("table", {},
    $("thead", {}, $("tr", {}, $("th", {}, "项"), $("th", {class: "num"}, "累计"), $("th", {class: "num"}, `近 ${b.window}s`))),
    $("tbody", {}, ...diagRows.map(([k, tot, win]) => {
      const bad = /失败|过多|不符/.test(k) && win > 0;
      return $("tr", {}, $("td", {}, k), $("td", {class: "num"}, tot ?? "—"), $("td", {class: "num" + (bad ? " bad-text" : "")}, win ?? "—"));
    }))));
  p.cmds.replaceChildren(b.cmds.length ? $("table", {},
    $("thead", {}, $("tr", {}, $("th", {}, "命令"), $("th", {class: "num"}, "帧/秒"), $("th", {class: "num"}, "最近"))),
    $("tbody", {}, ...b.cmds.map(c => $("tr", {},
      $("td", {class: "nowrap"}, `${c.cmd} ${c.name}`, c.cmd === "0x0A06" && c.message ? $("div", {class: "key"}, c.message.key) : null),
      $("td", {class: "num"}, fmt(c.rate, 1)), $("td", {class: "num"}, age(c.age))))))
    : $("div", {class: "empty"}, "还没解出帧"));
  p.recent.replaceChildren(b.recent.length ? $("table", {},
    $("thead", {}, $("tr", {}, $("th", {}, "命令"), $("th", {class: "num"}, "seq"), $("th", {}, "内容"), $("th", {class: "num"}, "时间"))),
    $("tbody", {}, ...b.recent.map(f => $("tr", {},
      $("td", {class: "nowrap"}, `${f.cmd} ${f.name}`), $("td", {class: "num"}, f.seq ?? "—"),
      $("td", {class: "msg"}, msgText(f.message)), $("td", {class: "num"}, age(f.age))))))
    : $("div", {class: "empty"}, "还没解出帧"));
  drawSpectrum(p);
}

function render() {
  if (!state) return;
  const team = state.team === "red" ? "红方" : state.team === "blue" ? "蓝方" : "—";
  document.getElementById("cfg").textContent = `配置：${team} · 干扰等级 ${state.jam_level ?? "—"}`;
  document.getElementById("cards").replaceChildren(...state.boards.map(card));
  for (const b of state.boards) if (b.role === "rx") renderPanel(b);
}

// ---------- 连接 ----------
function setConn(cls, text) {
  document.getElementById("conn").replaceChildren($("span", {class: "dot " + cls}), text);
}
let lastMsg = 0;
function connect() {
  const es = new EventSource("/api/events");
  es.addEventListener("state", e => { state = JSON.parse(e.data); lastMsg = Date.now(); setConn("ok", "已连接"); render(); });
  es.addEventListener("spectrum", e => { lastMsg = Date.now(); onSpectrum(JSON.parse(e.data)); });
  es.onerror = () => setConn("bad", "连接断开，重连中…");
}
setInterval(() => {
  document.getElementById("clock").textContent = new Date().toLocaleTimeString("zh-CN", {hour12: false});
  if (lastMsg && Date.now() - lastMsg > 3000) setConn("bad", "服务无响应");
}, 1000);
window.addEventListener("resize", () => { for (const p of Object.values(panels)) drawSpectrum(p); });
connect();
</script>
</body>
</html>
