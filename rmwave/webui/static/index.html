<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>信息波调试台</title>
<style>
:root {
  --bg: #0a0d12; --panel: #11151c; --panel-2: #161b24; --line: #212834; --line-2: #2b3442;
  --text: #dbe1e9; --muted: #7c8796; --faint: #4f5a68;
  --accent: #2dd4bf; --ok: #34d399; --warn: #fbbf24; --bad: #f87171; --idle: #4b5563;
  --ok-bg: rgba(52,211,153,.10); --warn-bg: rgba(251,191,36,.10); --bad-bg: rgba(248,113,113,.12); --idle-bg: rgba(75,85,99,.12);
  --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 13px/1.45 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .idle { color: var(--muted); }

/* 顶栏 */
.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 8px 16px; background: rgba(10,13,18,.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; letter-spacing: .02em; }
.brand i { width: 10px; height: 10px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border: 1px solid var(--line-2);
  border-radius: 999px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--idle); flex: none; }
.dot.ok { background: var(--ok); box-shadow: 0 0 6px var(--ok); } .dot.warn { background: var(--warn); }
.dot.bad { background: var(--bad); box-shadow: 0 0 6px var(--bad); } .dot.idle { background: var(--idle); }
.grow { flex: 1; }

/* 板子条 */
.strip { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); padding: 12px 16px 0; }
.tile { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--idle); border-radius: 8px;
  padding: 8px 10px; display: grid; gap: 3px; min-width: 0; }
.tile.ok { border-left-color: var(--ok); } .tile.warn { border-left-color: var(--warn); } .tile.bad { border-left-color: var(--bad); }
.tile-head { display: flex; align-items: center; gap: 6px; }
.tile-head b { font-family: var(--mono); font-size: 13px; }
.tag { font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line-2); }
.tile .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .main { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lights { display: flex; gap: 10px; font-size: 11.5px; color: var(--muted); }
.lights span { display: inline-flex; align-items: center; gap: 4px; }

/* 布局 */
.layout { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr) 330px; padding: 12px 16px 24px; align-items: start; }
@media (max-width: 1150px) { .layout { grid-template-columns: 1fr; } }
.side { display: grid; gap: 12px; position: sticky; top: 52px; }
@media (max-width: 1150px) { .side { position: static; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 10px 12px 0; }
.panel-head h2 { margin: 0; font: 600 14px var(--mono); }
.panel-body { padding: 10px 12px 12px; display: grid; gap: 10px; }
.rx-list { display: grid; gap: 12px; min-width: 0; }
.h3 { font-size: 11.5px; color: var(--muted); letter-spacing: .04em; margin: 0 0 4px; display: flex; justify-content: space-between; gap: 8px; }

/* 结论 */
.verdict { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; font-size: 13.5px; border: 1px solid; }
.verdict.ok { background: var(--ok-bg); border-color: rgba(52,211,153,.35); }
.verdict.warn { background: var(--warn-bg); border-color: rgba(251,191,36,.35); }
.verdict.bad { background: var(--bad-bg); border-color: rgba(248,113,113,.4); }
.verdict.idle { background: var(--idle-bg); border-color: var(--line-2); color: var(--muted); }
.verdict b { white-space: nowrap; }

/* 漏斗 */
.funnel { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px; }
@media (max-width: 900px) { .funnel { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.step { position: relative; background: var(--panel-2); border-top: 2px solid var(--idle); padding: 5px 7px 6px; min-width: 0; }
.step:first-child { border-radius: 6px 0 0 6px; } .step:last-child { border-radius: 0 6px 6px 0; }
.step.ok { border-top-color: var(--ok); } .step.warn { border-top-color: var(--warn); background: var(--warn-bg); }
.step.bad { border-top-color: var(--bad); background: var(--bad-bg); }
.step .l { font-size: 11px; color: var(--muted); white-space: nowrap; }
.step .v { font: 12.5px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 主体 */
.rx-grid { display: grid; gap: 10px; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
@media (max-width: 900px) { .rx-grid { grid-template-columns: 1fr; } }
.instr { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; align-content: start; }
@media (max-width: 520px) { .instr { grid-template-columns: 1fr; } }
.box { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; min-width: 0; }
canvas { display: block; width: 100%; border-radius: 6px; }
.plot { position: relative; }
.plot .ro { position: absolute; right: 8px; top: 5px; font: 11.5px var(--mono); color: #aab4c0; pointer-events: none; text-shadow: 0 0 3px #000; }
.snr { font: 12px var(--mono); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-size: 12px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-family: var(--mono); }
.meter { position: relative; height: 8px; background: #0b0f15; border-radius: 4px; overflow: hidden; margin: 3px 0 6px; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 4px; }
.meter i.mean { background: #3b82f6; }
.meter .clip { position: absolute; right: 0; top: 0; bottom: 0; width: 2px; background: var(--bad); }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 34px; }
.bars div { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 1px; position: relative; }
.bars div.e { background: var(--warn); } .bars div.e2 { background: var(--bad); }
.bars-x { display: flex; gap: 3px; font: 10.5px var(--mono); color: var(--faint); }
.bars-x span { flex: 1; text-align: center; }

/* 结果 */
.result { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.cmd { display: inline-grid; grid-template-columns: auto auto; gap: 0 6px; align-items: baseline; padding: 4px 8px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; }
.cmd.stale { opacity: .45; } .cmd.missing { border-style: dashed; opacity: .5; }
.cmd b { font: 600 12px var(--mono); } .cmd .r { font: 12px var(--mono); color: var(--accent); }
.cmd .a { grid-column: 1 / -1; font-size: 11px; color: var(--muted); }
.key { font: 700 20px var(--mono); color: var(--accent); letter-spacing: .08em; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; user-select: none; }
table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
th, td { padding: 3px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 500; }
td.n { text-align: right; font-family: var(--mono); white-space: nowrap; }
td.m { font: 11.5px var(--mono); color: var(--muted); word-break: break-all; }
td.c { white-space: nowrap; font-family: var(--mono); }

/* 侧栏 */
.tx { display: grid; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.tx:last-child { border-bottom: 0; }
.tx-head { display: flex; align-items: center; gap: 8px; }
.tx-head b { font: 600 13px var(--mono); }
.tx .health { font-size: 12px; }
.events { max-height: 52vh; overflow: auto; padding: 4px 0; }
.ev { display: grid; grid-template-columns: auto auto 1fr; gap: 6px; align-items: baseline; padding: 4px 12px; font-size: 12px; border-bottom: 1px solid var(--line); }
.ev:last-child { border-bottom: 0; }
.ev .t { font: 11px var(--mono); color: var(--faint); } .ev .b { font: 11.5px var(--mono); color: var(--muted); }
.empty { color: var(--muted); font-size: 12px; padding: 8px 12px; }

/* 控制 */
button, select, input { font: inherit; font-size: 12px; color: var(--text); }
.btn { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 3px 10px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); } .btn:active { transform: translateY(1px); }
.btn.go { border-color: rgba(52,211,153,.5); color: var(--ok); } .btn.halt { border-color: rgba(248,113,113,.5); color: var(--bad); }
.btn.sm { padding: 1px 8px; font-size: 11.5px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; }
.seg button { background: transparent; border: 0; border-right: 1px solid var(--line-2); padding: 3px 10px; cursor: pointer; color: var(--muted); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--panel-2); color: var(--text); }
.seg button.on.red { color: #fca5a5; background: rgba(248,113,113,.15); } .seg button.on.blue { color: #93c5fd; background: rgba(96,165,250,.15); }
.ctlbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ctlbar .lab { color: var(--muted); font-size: 12px; }
input.field, select.field { background: #0b0f15; border: 1px solid var(--line-2); border-radius: 6px; padding: 3px 7px; }
input.field:focus, select.field:focus { outline: none; border-color: var(--accent); }
input.num6 { width: 7.5em; font-family: var(--mono); letter-spacing: .06em; } input.numdb { width: 5.5em; font-family: var(--mono); }
.ctlrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; }
.ctlrow .lab { color: var(--muted); }
.tile .ctl { display: flex; gap: 4px; margin-top: 3px; }
pre.log { margin: 6px 0 0; max-height: 220px; overflow: auto; background: #070a0e; border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 8px; font: 11.5px/1.5 var(--mono); color: #aab4c0; white-space: pre-wrap; word-break: break-all; }
.toast { position: sticky; top: 52px; z-index: 9; margin: 8px 16px 0; padding: 6px 12px; border-radius: 8px; font-size: 13px; display: none; }
.toast.ok { display: block; background: var(--ok-bg); border: 1px solid rgba(52,211,153,.35); }
.toast.bad { display: block; background: var(--bad-bg); border: 1px solid rgba(248,113,113,.4); }
.mode-tag { font-size: 11.5px; color: var(--warn); }
</style>
</head>
<body>
<div class="top">
  <div class="brand"><i></i>信息波调试台</div>
  <span class="pill" id="cfg">—</span>
  <div class="ctlbar" id="ctl-global" style="display:none">
    <span class="lab">阵营</span>
    <span class="seg" id="seg-team"><button data-team="red" class="red">红方</button><button data-team="blue" class="blue">蓝方</button></span>
    <span class="lab">干扰等级</span>
    <span class="seg" id="seg-level"><button data-level="1">1</button><button data-level="2">2</button><button data-level="3">3</button></span>
    <button class="btn go" id="btn-start-all">全部启动</button>
    <button class="btn halt" id="btn-stop-all">全部停止</button>
    <span class="mode-tag" id="mode-tag"></span>
  </div>
  <span class="grow"></span>
  <span class="pill" id="conn"><span class="dot"></span>连接中</span>
  <span class="pill num" id="clock">—</span>
</div>
<div class="toast" id="toast"></div>
<div class="strip" id="strip"></div>
<div class="layout">
  <div class="rx-list" id="rx-list"></div>
  <aside class="side">
    <section class="panel"><div class="panel-head"><h2>发射板</h2></div><div id="tx-list"></div></section>
    <section class="panel"><div class="panel-head"><h2>事件</h2><span class="muted" style="font-size:12px">最新在上</span></div><div class="events" id="events"></div></section>
  </aside>
</div>
<script>
"use strict";
const FS = 1e6, N = 1024, DB_MIN = -130, DB_MAX = 0;
const WAVE_COLORS = { red: "rgba(248,113,113,", blue: "rgba(96,165,250," };
const INFO_CMDS = [["0x0A01", "位置"], ["0x0A02", "血量"], ["0x0A03", "弹量"], ["0x0A04", "宏观"], ["0x0A05", "增益"]];
let state = null;
const rx = {};      // name -> 面板对象
let lastMsg = 0;

// ---------- 工具 ----------
const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const f = (v, d = 1) => v == null || !isFinite(v) ? "—" : Number(v).toFixed(d);
const khz = hz => hz == null ? "—" : (hz >= 0 ? "+" : "") + (hz / 1e3).toFixed(1) + " kHz";
const mhz = hz => hz == null ? "—" : (hz / 1e6).toFixed(2) + " MHz";
const ago = s => s == null ? "—" : s < 1.5 ? "刚刚" : s < 60 ? `${s.toFixed(0)} 秒前` : `${(s / 60).toFixed(0)} 分钟前`;
const waveName = w => !w ? "" : `${w.team === "red" ? "红方" : "蓝方"}${w.level === 0 ? "信息波" : "干扰波 L" + w.level}`;
const dot = s => `<span class="dot ${s}"></span>`;
const DPR = () => window.devicePixelRatio || 1;
function fit(c) {
  const w = Math.round(c.clientWidth * DPR()), h = Math.round(c.clientHeight * DPR());
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; return true; }
  return false;
}
function setHTML(node, html) { if (node._h !== html) { node.innerHTML = html; node._h = html; } }
function boardState(b) {
  if (!b.running) return b.status_age == null ? "idle" : "bad";
  return b.role === "rx" ? (b.verdict?.state ?? "idle") : (b.health?.state ?? "idle");
}

// ---------- 控制 ----------
let toastTimer = null;
function toast(ok, text) {
  const t = $("#toast"); t.className = "toast " + (ok ? "ok" : "bad"); t.textContent = text;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = "toast"; }, ok ? 3500 : 8000);
}
async function ctl(body) {
  try {
    const r = await fetch("/api/control", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    const j = await r.json();
    toast(j.ok, j.ok ? j.message : j.error);
    return j.ok;
  } catch (e) { toast(false, "请求失败：" + e); return false; }
}
const ctlState = name => state && state.control && state.control.boards[name];
function setVal(input, v) { if (document.activeElement !== input && input._v !== v) { input.value = v ?? ""; input._v = v; } }
function initGlobal() {
  $("#seg-team").addEventListener("click", e => { const t = e.target.dataset.team; if (t && t !== state.control.settings.team) ctl({action: "set_global", team: t}); });
  $("#seg-level").addEventListener("click", e => { const l = e.target.dataset.level; if (l && +l !== state.control.settings.jam_level) ctl({action: "set_global", jam_level: +l}); });
  $("#btn-start-all").onclick = () => ctl({action: "start_all"});
  $("#btn-stop-all").onclick = () => { if (confirm("停止全部板子？")) ctl({action: "stop_all"}); };
}
function renderGlobal() {
  const c = state.control, box = $("#ctl-global");
  box.style.display = c ? "" : "none";
  $("#cfg").style.display = c ? "none" : "";
  if (!c) return;
  for (const b of $("#seg-team").children) b.classList.toggle("on", b.dataset.team === c.settings.team);
  for (const b of $("#seg-level").children) b.classList.toggle("on", +b.dataset.level === c.settings.jam_level);
  setHTML($("#mode-tag"), c.sim_dir ? `仿真回放 ${esc(c.sim_dir)}` : "");
}

// ---------- 板子条 ----------
const tiles = {};
function makeTile(name) {
  const t = el("div", "tile"), info = el("div"), ctlBox = el("div", "ctl");
  ctlBox.innerHTML = `<button class="btn sm go" data-a="start">启动</button><button class="btn sm" data-a="restart">重启</button><button class="btn sm halt" data-a="stop">停止</button>`;
  ctlBox.addEventListener("click", e => { const a = e.target.dataset.a; if (a) ctl({action: a, board: name}); });
  t.append(info, ctlBox); $("#strip").append(t);
  return tiles[name] = {t, info, ctlBox};
}
function renderStrip() {
  for (const b of state.boards) {
    const tl = tiles[b.name] || makeTile(b.name), cs = ctlState(b.name);
    tl.t.className = "tile " + boardState(b);
    tl.ctlBox.style.display = cs ? "" : "none";
    if (cs) {
      tl.ctlBox.querySelector('[data-a="start"]').style.display = cs.want_running ? "none" : "";
      tl.ctlBox.querySelector('[data-a="restart"]').style.display = cs.want_running ? "" : "none";
      tl.ctlBox.querySelector('[data-a="stop"]').style.display = cs.want_running ? "" : "none";
    }
    setHTML(tl.info, tileInfo(b, cs));
  }
}
function tileInfo(b, cs) {
  const s = b.status || {}, w = s.wave;
  const ping = b.reachable == null ? "idle" : b.reachable ? "ok" : "bad";
  const proc = b.running ? "ok" : b.status_age == null && !(cs && cs.want_running) ? "idle" : "bad";
  let main;
  if (!b.running) main = cs && cs.want_running ? `<span class="warn">启动中…</span>` : `<span class="muted">未运行</span>`;
  else if (b.role === "rx") main = `<span class="${b.verdict.state}">${esc(b.verdict.state === "ok" ? "全链路正常" : b.verdict.stage + "：" + (b.funnel.find(x => x.label === b.verdict.stage)?.value ?? ""))}</span>`;
  else main = `<span class="${b.health.state}">${f(b.win.packets_rate, 1)} 包/s</span>${s.key ? ` · <span class="mono">${esc(s.key)}</span>` : ""}`;
  const extra = cs && cs.restarts && !state.control.sim_dir ? ` · <span class="warn">自动重启 ${cs.restarts} 次</span>` : "";
  return `<div class="tile-head"><b>${esc(b.name)}</b><span class="tag">${b.role === "tx" ? "发" : "收"}</span><span class="grow"></span>
      <span class="lights"><span>${dot(ping)}板</span><span>${dot(proc)}进程</span></span></div>
    <div class="sub">${esc(w ? waveName(w) + " · " + mhz(w.center_hz) : (b.wave_cfg === "info" ? "信息波" : "干扰波"))} · ${esc(b.uri || "")}</div>
    <div class="main">${main}${extra}</div>`;
}

// ---------- 接收板面板 ----------
function makeRx(name) {
  const p = { name, hold: null, db: null, hoverX: null };
  const sec = el("section", "panel");
  sec.innerHTML = `
    <div class="panel-head"><h2>${esc(name)}</h2><span class="muted head-sub"></span></div>
    <div class="panel-body">
      <div class="verdict idle"><b class="vstage">—</b><span class="vtext">等待数据…</span></div>
      <div class="funnel"></div>
      <div class="rx-grid">
        <div style="display:grid; gap:6px; align-content:start; min-width:0">
          <p class="h3" style="margin:0"><span>频谱 · 瀑布图</span><span class="snr"></span></p>
          <div class="plot"><canvas class="spec" style="height:210px"></canvas><div class="ro"></div></div>
          <canvas class="wf" style="height:120px"></canvas>
          <div class="faint" style="font-size:11px">横轴为中心频点 ±500 kHz。青线实时，橙线峰值保持；虚线是 AFC 偏移（绿=锁定，黄=搜索）；色块为红蓝双方各波的位置，亮框是本板要收的波。</div>
        </div>
        <div class="instr">
          <div class="box"><p class="h3"><span>输入电平</span><span class="lvl-gain"></span></p><div class="lvl"></div><canvas class="lvl-c" style="height:46px"></canvas></div>
          <div class="box"><p class="h3"><span>眼图</span><span class="eye-tag"></span></p><canvas class="eye" style="height:96px"></canvas></div>
          <div class="box"><p class="h3"><span>AFC 频偏（120 s）</span><span class="afc-now mono"></span></p><canvas class="afc" style="height:78px"></canvas></div>
          <div class="box"><p class="h3"><span>包质量</span><span class="q-n"></span></p><div class="quality"></div></div>
        </div>
      </div>
      <div class="result"></div>
      <div class="ctlrow rxctl" style="display:none">
        <span class="lab">接收增益</span>

function cmap(t) {

  setHTML($("#events"), ev.length ? ev.map(e => {
    const t = new Date(e.t * 1000).toLocaleTimeString("zh-CN", {hour12: false});
    return `<div class="ev">${dot(e.level === "info" ? "idle" : e.level)}<span class="t">${t}</span><span><span class="b">${esc(e.board)}</span> ${esc(e.text)}</span></div>`;
  }).join("") : `<div class="empty">暂无事件</div>`);
}

function render() {
  if (!state) return;
  const team = state.team === "red" ? "红方" : state.team === "blue" ? "蓝方" : "—";
  $("#cfg").textContent = `配置 ${team} · 干扰等级 ${state.jam_level ?? "—"}`;
  renderGlobal();
  renderStrip();
  for (const b of state.boards) if (b.role === "rx") renderRx(b);
  renderTx();
  renderEvents();
}
function onSpectrum(m) {
  const p = rx[m.board]; if (!p) return;
  p.db = m.db;
  if (!p.hold) p.hold = m.db.slice(); else for (let i = 0; i < N; i++) p.hold[i] = Math.max(m.db[i], p.hold[i] - 0.2);
  drawSpec(p); pushWf(p, m.db);
}

// ---------- 连接 ----------
function setConn(s, t) { $("#conn").innerHTML = `${dot(s)}${t}`; }
function connect() {
  const es = new EventSource("/api/events");
  es.addEventListener("state", e => { state = JSON.parse(e.data); lastMsg = Date.now(); setConn("ok", "已连接"); render(); });
  es.addEventListener("spectrum", e => { lastMsg = Date.now(); onSpectrum(JSON.parse(e.data)); });
  es.onerror = () => setConn("bad", "断开，重连中");
}
setInterval(() => {
  $("#clock").textContent = new Date().toLocaleTimeString("zh-CN", {hour12: false});
  if (lastMsg && Date.now() - lastMsg > 3000) setConn("bad", "服务无响应");
}, 1000);
window.addEventListener("resize", () => { for (const p of Object.values(rx)) { drawSpec(p); if (p.b) renderRx(p.b); } });
initGlobal();
connect();
</script>
</body>
</html>
